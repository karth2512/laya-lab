# a1: Laya zero-shot typed choice question. No training; val picks the label wording.
labels_file: configs/prompts/labels.yaml
variants: null            # null = every variant in labels_file; or a list of names
batch_size: 16
max_len: 512              # Laya's limit; the question head takes ~40 tokens of it
option_order_check: true  # re-score the selected variant on val with options reversed
