[project]
name = "laya-bench"
version = "0.1.0"
description = "Benchmark Laya as a text classifier on the Medical Abstracts TC Corpus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "scikit-learn>=1.5",
    "huggingface-hub>=0.30",
    "psutil>=6.0",
    "pyarrow>=25.0.1",
    "mlflow>=3.0",
    "matplotlib>=3.9",
    "scipy>=1.13",
]

[project.optional-dependencies]
baselines = []
laya = [
    "torch>=2.8",
    "transformers>=5.0",
    "peft>=0.17",
    "laya>=0.3.28",
]
jev = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "types-psutil",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
